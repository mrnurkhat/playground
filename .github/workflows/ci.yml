on: push
jobs:
  build-gcc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cmake -B build
      - run: cmake --build build
      - run: ctest --test-dir build

  build-clang:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt update && sudo apt install clang
      - run: cmake -B build -DCMAKE_CXX_COMPILER=clang++
      - run: cmake --build build
      - run: ctest --test-dir build
